name: Coverage baseline
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Publishes the rolling coverage baseline consumed by the `test-coverage`
# job in `pr-checks.yaml`: every main build exports its per-workspace
# coverage summary as an artifact, and PRs are checked against
# max(latest artifact, checked-in coverage-baseline.json floor).
# Secret-free by design, same as pr-checks — see the note there.
permissions:
  contents: read

jobs:
  coverage:
    name: Export rolling coverage baseline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20.x
      - name: Enable corepack
        run: corepack enable
      - name: Install dependencies
        run: |
          yarn install --check-cache
          yarn allow-scripts
      - name: Test with coverage
        run: yarn test:coverage
      - name: Export baseline
        run: node scripts/coverage-ratchet.mjs --export coverage-rolling.json
      - name: Upload rolling baseline
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-rolling
          path: coverage-rolling.json
          retention-days: 90
